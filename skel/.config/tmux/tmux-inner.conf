# Inherit the shared tmux settings, including prefix pane navigation.
source-file ~/.config/tmux/tmux-core.conf

# Cycle windows without a prefix.
bind -n C-l next-window
bind -n C-h previous-window

# Optional visual layer; keep functional settings above this include.
source-file ~/.config/tmux/tmux-style.conf

# The nested session name is a workspace hash; use a compact visual label.
set -g status-left '#[bg=themeblue,fg=themeblack,bold] #{?client_prefix,PREFIX,TERM} #[default] '
