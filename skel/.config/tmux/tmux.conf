source-file ~/.config/tmux/tmux-core.conf

# Toggle a two-pane layout: zoom pane 0, then restore the split and focus pane 1.
# if-shell reparses string arguments, so use command blocks instead of escaped ;.
bind -n C-t if-shell -F '#{window_zoomed_flag}' {
    resize-pane -Z
    select-pane -t :.1
} {
    select-pane -t :.0
    resize-pane -Z
}
