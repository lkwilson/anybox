# The minimal config to make mouse scrolling work
set -g mouse on



# Cycle windows without a prefix. C-h and C-l remain available to programs
# such as Neovim.
bind -n C-j next-window
bind -n C-k previous-window

# In a nested tmux, use C-b C-b to pass this prefix to the outer tmux, then
# j or k to select the lower or upper outer pane.
bind j select-pane -D
bind k select-pane -U
