# The minimal config to make mouse scrolling work
set -g mouse on

# Send Escape immediately instead of waiting for an escape sequence.
set -s escape-time 0

# Allow the OSC 52 sequence emitted by `clip` to reach the terminal emulator.
# This is needed when the command runs inside tmux, including over SSH.
set -g allow-passthrough on

# This is the outer server for `tt`. It must accept OSC 52 sent by the inner
# tmux server and forward it to Kitty.
set -s set-clipboard on

# Restart the pane's original command in its current directory.
bind R respawn-pane -k -c "#{pane_current_path}"

# Use vim-style keys to move between panes after the tmux prefix (C-b).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
