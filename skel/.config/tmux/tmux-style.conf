# Optional visual layer, loaded last by the outer and inner configs.
# Kanagawa Dragon (dark) / Lotus (light), using tmux 3.8's native detection.
# Palette source: https://github.com/rebelot/kanagawa.nvim/blob/master/lua/kanagawa/colors.lua
# Kitty follows macOS appearance; tmux follows the client's reported theme.
# Unknown client appearance falls back to Dragon. No polling or theme plugin.
set -s theme detect

# Palette roles: canvas, text, muted border, panel, then accent colours.
set -s dark-theme-black '#181616'
set -s dark-theme-white '#c5c9c5'
set -s dark-theme-light-grey '#625e5a'
set -s dark-theme-dark-grey '#282727'
set -s dark-theme-green '#87a987'
set -s dark-theme-yellow '#c4b28a'
set -s dark-theme-red '#c4746e'
set -s dark-theme-blue '#8ba4b0'
set -s dark-theme-cyan '#8ea4a2'
set -s dark-theme-magenta '#a292a3'

set -s light-theme-black '#f2ecbc'
set -s light-theme-white '#545464'
set -s light-theme-light-grey '#8a8980'
set -s light-theme-dark-grey '#e7dba0'
set -s light-theme-green '#6f894e'
set -s light-theme-yellow '#77713f'
set -s light-theme-red '#c84053'
set -s light-theme-blue '#4d699b'
set -s light-theme-cyan '#597b75'
set -s light-theme-magenta '#766b90'

# Layout and styling. Named colours resolve separately for each client.
set -g status-position bottom
set -g status-interval 2
set -g status-style 'bg=themeblack,fg=themewhite'
set -g status-left-length 24
set -g status-left '#[bg=themeblue,fg=themeblack,bold] #{?client_prefix,PREFIX,TMUX} #[bg=themedarkgrey,fg=thememagenta,nobold] #{=12:session_name} #[default] '
set -g status-right-length 72
set -g status-right '#[fg=themecyan] #{=/-48/...:pane_current_path} #[fg=themelightgrey]|#[fg=thememagenta]#{?#{>=:client_width,110}, #h |,} #[fg=themewhite]%H:%M '
set -g window-status-separator ''
setw -g window-status-style 'bg=themeblack,fg=themewhite'
setw -g window-status-format ' #I #{=/20/...:#{b:pane_current_path}}#{window_flags} '
setw -g window-status-current-format '#[bg=themegreen,fg=themeblack,bold] #I #{=/20/...:#{b:pane_current_path}}#{?window_zoomed_flag, [Z],} #[default]'
setw -g window-status-activity-style 'fg=themeyellow,bold'
set -g pane-border-style 'fg=themelightgrey'
set -g pane-active-border-style 'fg=themegreen'
set -g message-style 'bg=themeblue,fg=themeblack'
set -g mode-style 'bg=themegreen,fg=themeblack,bold'

