# The minimal config to make mouse scrolling work
set -g mouse on

# Send Escape immediately instead of waiting for an escape sequence.
set -s escape-time 0

# Allow the OSC 52 sequence emitted by `clip` to reach the terminal emulator.
# This is needed when the command runs inside tmux, including over SSH.
set -g allow-passthrough on

# Start new windows and splits in the current pane's working directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Use vim-style keys to move between panes after the tmux prefix (C-b).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
