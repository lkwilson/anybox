# Inherit the shared tmux settings, including prefix pane navigation.
source-file ~/.config/tmux/tmux-core.conf

# Copy-mode selections from this nested server may write to its outer tmux,
# while programs in panes cannot request clipboard writes directly.
set -s set-clipboard external

# Cycle windows without a prefix. This is only available for tmux sessions
# started with this specific config.
bind -n C-l next-window
bind -n C-h previous-window
