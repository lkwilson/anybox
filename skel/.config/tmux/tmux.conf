source-file ~/.config/tmux/tmux-core.conf

# This is the outer server for `tt`. It must accept OSC 52 sent by the inner
# tmux server and forward it to Kitty.
set -s set-clipboard on

# Start outer windows and splits in the current pane's working directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Switch outer windows; leave C-h/l for applications and nested tt terminals.
bind -n C-j next-window
bind -n C-k previous-window

# Toggle a two-pane layout: zoom pane 0, then restore the split and focus pane 1.
# if-shell reparses string arguments, so use command blocks instead of escaped ;.
bind -n C-_ if-shell -F '#{window_zoomed_flag}' {
    resize-pane -Z
    select-pane -t :.1
} {
    select-pane -t :.0
    resize-pane -Z
}
