# Optional visual layer, loaded last by the outer and inner configs.
# Midnight status bar: directory tabs, a cyan active window, and a live path.
# Use indexed colours and ordinary glyphs; no theme plugin or patched font.
set -g status-position bottom
set -g status-interval 2
set -g status-style 'bg=colour234,fg=colour250'
set -g status-left-length 24
set -g status-left '#[bg=colour61,fg=colour231,bold] #{?client_prefix,PREFIX,TMUX} #[bg=colour237,fg=colour189,nobold] #{=12:session_name} #[default] '
set -g status-right-length 72
set -g status-right '#[fg=colour117] #{=/-48/...:pane_current_path} #[fg=colour240]|#[fg=colour189]#{?#{>=:client_width,110}, #h |,} #[fg=colour252]%H:%M '
set -g window-status-separator ''
setw -g window-status-style 'bg=colour234,fg=colour250'
setw -g window-status-format ' #I #{=/20/...:#{b:pane_current_path}}#{window_flags} '
setw -g window-status-current-format '#[bg=colour80,fg=colour234,bold] #I #{=/20/...:#{b:pane_current_path}}#{?window_zoomed_flag, [Z],} #[default]'
setw -g window-status-activity-style 'fg=colour215,bold'
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour80'
set -g message-style 'bg=colour61,fg=colour231'
set -g mode-style 'bg=colour80,fg=colour234,bold'

